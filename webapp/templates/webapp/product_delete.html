{% extends 'webapp/base.html' %}
{% block content %}
<h4 class="mb-3">Удалить товар?</h4>
<p>Вы уверены что хотите удалить <strong> {{product.name}}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit"class="btn btn-danger">Удалить</button>
    <a href="{% url 'product_view' product.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
